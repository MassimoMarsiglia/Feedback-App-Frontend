version: 0.2

env:
  variables:
    VITE_API_BASE_URL: "https://api.yourdomain.com"
    VITE_APP_ENV: "production"
phases:
  install:
    runtime-versions:
      nodejs: 22

  pre_build:
    commands:
      - echo Installing dependencies...
      - cd feedback-app
      - npm install
  build:
    commands:
      - echo Build started on `date`
      - echo "Building with API URL:" $VITE_API_BASE_URL
      - npm run build
      - echo Build completed on `date`
artifacts:
  files:
    - index.html   # Include the root index file
    - assets/**/* # Explicitly include ALL contents of the assets folder, retaining its path
  base-directory: feedback-app/dist
cache:
  paths:
    - 'node_modules/**/*'